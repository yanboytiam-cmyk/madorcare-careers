<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Careers — MaDorCARE</title>
<meta name="description" content="Apply to join the MaDorCARE care team in Dallas. Therapist, Target Case Manager, and Nurse Practitioner roles open now.">

<meta property="og:type" content="website">

<link rel="icon" href="assets/madorcare-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

  <img id="brandLogo" class="topbar__logo" src="assets/madorcare-logo.png" alt="MaDorCARE logo">

</div>

    <p>Turn JavaScript on and reload, or email your resume to
      <a href="mailto:info@madorcare.com">info@madorcare.com</a> with the role you want in the subject line.</p>
  </div>
</noscript>

<script src="config.js"></script>
<script src="app.js"></script>
